# Konteyner ichidagi Nginx.
#
# Faqat statik fayllarni beradi. TLS, domen va yo'naltirish
# Coolify'ning proksisida (Traefik) hal qilinadi — shuning uchun
# bu yerda 443 ham, sertifikat ham yo'q.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    #
    # SPA. Marshrutlarni React hal qiladi, shuning uchun topilmagan
    # yo'l index.html ga qaytariladi.
    #
    # BUSIZ: foydalanuvchi /patients da turib sahifani yangilasa,
    # Nginx diskda shunday fayl topolmay 404 berardi.
    #
    location / {
        try_files $uri $uri/ /index.html;
    }

    #
    # Fayl nomida hash bor (index-BJb_kCdp.js) — o'zgarsa nomi ham
    # o'zgaradi, ya'ni uzoq keshlash xavfsiz.
    #
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    #
    # index.html KESHLANMAYDI: u yangi fayllarning nomini biladi.
    # Eskisi keshda qolsa, brauzer yo'q bo'lgan fayllarni so'raydi
    # va yangilanishdan keyin sahifa oq qoladi.
    #
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
