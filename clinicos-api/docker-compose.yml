# Ishlab chiqish uchun baza.
#
# Bitta buyruq bilan ko'tariladi:
#
#     docker compose up -d
#
# Ma'lumot `pgdata` nomli hajmda saqlanadi — konteyner o'chirilsa ham
# yo'qolmaydi. Butunlay tozalash uchun: docker compose down -v

services:
  db:
    image: postgres:17-alpine
    container_name: clinicos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicos
      POSTGRES_PASSWORD: clinicos_dev
      POSTGRES_DB: clinicos
      # Sana va matn tartibi uchun. Bemor ismlari kirill va lotin
      # aralash bo'lishi mumkin, shuning uchun UTF-8 aniq belgilanadi.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5432 kompyuterda band bo'lishi mumkin — 5433 ga chiqaramiz
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicos -d clinicos"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
