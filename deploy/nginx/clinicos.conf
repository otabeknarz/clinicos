# ClinicOS — Nginx.
#
# Ikkita server bloki: interfeys va API.
#
#   clinic-os.uz       → yig'ilgan fayllar (dist/)
#   api.clinic-os.uz   → NestJS, 127.0.0.1:3000
#
# DOMENNI O'ZINGIZNIKIGA ALMASHTIRING.
#
# Joylashtirish:
#   sudo cp clinicos.conf /etc/nginx/sites-available/clinicos
#   sudo ln -s /etc/nginx/sites-available/clinicos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL qatorlarini certbot o'zi qo'shadi:
#   sudo certbot --nginx -d clinic-os.uz -d api.clinic-os.uz

# ------------------------------------------------------------------
# INTERFEYS
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name clinic-os.uz www.clinic-os.uz;

    root /var/www/clinicos;
    index index.html;

    # Yuklanadigan rasm va fayllar uchun oqilona chegara
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    #
    # SPA. Marshrutlarni React hal qiladi, shuning uchun topilmagan
    # yo'l index.html ga qaytariladi.
    #
    # BUSIZ: foydalanuvchi /patients da turib sahifani yangilasa,
    # Nginx diskda shunday fayl topolmay 404 beradi.
    #
    location / {
        try_files $uri $uri/ /index.html;
    }

    #
    # Yig'ilgan fayllar nomida hash bor (index-BJb_kCdp.js), ya'ni
    # o'zgarsa nomi ham o'zgaradi. Shuning uchun uzoq keshlash xavfsiz.
    #
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    #
    # index.html KESHLANMAYDI. U yangi fayllarning nomini biladi;
    # eskisi keshda qolsa, brauzer yo'q bo'lgan fayllarni so'raydi
    # va yangilanishdan keyin sahifa oq qoladi.
    #
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# ------------------------------------------------------------------
# API
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.clinic-os.uz;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        #
        # DIQQAT: `$remote_addr`, `$proxy_add_x_forwarded_for` EMAS.
        #
        # Ikkinchisi mijoz yuborgan sarlavhaga qo'shib qo'yadi, ya'ni
        # mijozning o'zi yozgan qiymat BIRINCHI bo'lib qoladi. Audit
        # jurnali esa birinchi qiymatni oladi — natijada jurnalda
        # mijoz xohlagan manzil turardi.
        #
        # Bu yerda sarlavha butunlay qayta yoziladi.
        #
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
